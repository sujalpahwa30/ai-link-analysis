name: CI

# Runs on demand from the Actions tab.
#
# Push/PR triggers are intentionally commented out: GitHub currently refuses to
# start any job on this account ("The job was not started because your account
# is locked due to a billing issue"), which painted every commit with a red X
# even though no step ran. Once billing is resolved, restore the block below.
#
# on:
#   push:
#     branches: [main]
#   pull_request:

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest
