[project]
name = "ai-link-analysis"
version = "1.0.0"
description = "FastAPI website analysis API powered by an LLM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
